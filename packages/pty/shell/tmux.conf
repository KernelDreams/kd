# nr-pty §2: сервер tmux терминалов nr (свой сокет -L, чужой ~/.tmux.conf не читается).
# Размер — последнего активного клиента (человек в xterm), не меньшего.
set -g window-size latest
set -g status off
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g default-terminal "xterm-256color"
set -g set-titles off
set -g allow-rename off
set -g set-clipboard on
# Префикса нет: терминалом управляет nr, Ctrl+B — шеллу.
set -g prefix None
set -g prefix2 None
unbind C-b
