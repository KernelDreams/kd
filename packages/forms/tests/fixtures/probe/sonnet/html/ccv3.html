<nr-editor id="ccv3" title="Карточка бота CCv3">
  <script type="application/schema+json">
{
  "type": "object",
  "required": ["spec", "spec_version", "data"],
  "properties": {
    "spec": {"type":"string","title":"spec","default":"chara_card_v3"},
    "spec_version": {"type":"string","title":"spec_version","default":"3.0"},
    "data": {"type":"object","required":["name"],"properties":{
      "name": {"type":"string","title":"Имя"},
      "nickname": {"type":"string","title":"Псевдоним"},
      "description": {"type":"string","title":"Описание"},
      "personality": {"type":"string","title":"Характер"},
      "scenario": {"type":"string","title":"Сценарий"},
      "first_mes": {"type":"string","title":"Первое сообщение"},
      "mes_example": {"type":"string","title":"Примеры диалога"},
      "alternate_greetings": {"type":"array","title":"Альтернативные гритинги","items":{"type":"string"}},
      "group_only_greetings": {"type":"array","title":"Гритинги только для групп","items":{"type":"string"}},
      "system_prompt": {"type":"string","title":"Системный промпт"},
      "post_history_instructions": {"type":"string","title":"Инструкции после истории"},
      "creator_notes": {"type":"string","title":"Заметки автора"},
      "creator": {"type":"string","title":"Автор"},
      "character_version": {"type":"string","title":"Версия персонажа"},
      "tags": {"type":"array","title":"Теги","items":{"type":"string"}},
      "extensions": {"type":"object","title":"Расширения","properties":{
        "nrchat": {"type":"object","properties":{
          "kind": {"type":"string","enum":["bot","persona"],"title":"Тип"}}}}},
      "character_book": {"type":"object","title":"Лорбук","properties":{
        "name": {"type":"string","title":"Название"},
        "scan_depth": {"type":"integer","minimum":0,"title":"Глубина сканирования"},
        "token_budget": {"type":"integer","minimum":0,"title":"Бюджет токенов"},
        "recursive_scanning": {"type":"boolean","title":"Рекурсивное сканирование"},
        "entries": {"type":"array","title":"Записи","items":{"type":"object","properties":{
          "name": {"type":"string","title":"Название"},
          "keys": {"type":"array","title":"Ключи","items":{"type":"string"}},
          "content": {"type":"string","title":"Содержимое"},
          "enabled": {"type":"boolean","title":"Включена","default":true},
          "insertion_order": {"type":"integer","title":"Порядок вставки"},
          "case_sensitive": {"type":"boolean","title":"Учитывать регистр"},
          "priority": {"type":"integer","title":"Приоритет"},
          "comment": {"type":"string","title":"Комментарий"}}}}}},
      "assets": {"type":"array","title":"Ассеты","items":{"type":"object","properties":{
        "type": {"type":"string","title":"Тип"},
        "uri": {"type":"string","title":"Изображение"},
        "name": {"type":"string","title":"Название"},
        "ext": {"type":"string","title":"Расширение"}}}}
    }}
  }
}
  </script>
  <style>
    .panel { border: 1px solid var(--nr-line); border-radius: var(--nr-radius); padding: var(--nr-space-4); }
    .row { display: flex; gap: var(--nr-space-4); }
    h2 { font-family: var(--nr-font-ui); color: var(--nr-accent); }
  </style>
  <section data-section="card" data-title="Карточка" class="panel">
    <h2>Карточка</h2>
    <div data-row class="row">
      <input data-path="data.name" data-label="Имя">
      <input data-path="data.nickname" data-label="Псевдоним">
    </div>
    <select data-path="data.extensions.nrchat.kind" data-label="Тип" data-props='{"labels":{"bot":"Бот","persona":"Персона"}}'></select>
    <div data-row class="row">
      <input data-path="data.creator" data-label="Автор">
      <input data-path="data.character_version" data-label="Версия персонажа">
    </div>
    <div data-row class="row">
      <input data-path="spec" data-label="spec">
      <input data-path="spec_version" data-label="spec_version">
    </div>
    <nr-widget data-path="data.tags" data-widget="tags" data-label="Теги"></nr-widget>
  </section>
  <section data-section="persona" data-title="Описание" class="panel">
    <h2>Описание</h2>
    <textarea data-path="data.description" data-label="Описание" data-props='{"rows":8}'></textarea>
    <textarea data-path="data.personality" data-label="Характер" data-props='{"rows":4}'></textarea>
    <textarea data-path="data.scenario" data-label="Сценарий" data-props='{"rows":4}'></textarea>
  </section>
  <section data-section="dialogue" data-title="Диалог" class="panel" data-show-if='{"data.extensions.nrchat.kind":["bot"]}'>
    <h2>Диалог</h2>
    <textarea data-path="data.first_mes" data-label="Первое сообщение" data-props='{"rows":6}'></textarea>
    <nr-widget data-path="data.alternate_greetings" data-widget="ccv3.greetings" data-label="Альтернативные гритинги"></nr-widget>
    <nr-widget data-path="data.group_only_greetings" data-widget="list" data-label="Гритинги только для групп" data-props='{"itemLabel":"Гритинг"}'></nr-widget>
    <textarea data-path="data.mes_example" data-label="Примеры диалога" data-props='{"rows":8}'></textarea>
  </section>
  <section data-section="prompts" data-title="Промпты и заметки" class="panel">
    <h2>Промпты и заметки</h2>
    <textarea data-path="data.system_prompt" data-label="Системный промпт" data-props='{"rows":6}'></textarea>
    <textarea data-path="data.post_history_instructions" data-label="Инструкции после истории" data-props='{"rows":4}'></textarea>
    <nr-widget data-path="data.creator_notes" data-widget="markdown" data-label="Заметки автора"></nr-widget>
  </section>
  <section data-section="lorebook" data-title="Лорбук" class="panel">
    <h2>Лорбук</h2>
    <input data-path="data.character_book.name" data-label="Название">
    <div data-row class="row">
      <input type="number" data-path="data.character_book.scan_depth" data-label="Глубина сканирования">
      <input type="number" data-path="data.character_book.token_budget" data-label="Бюджет токенов">
      <input type="checkbox" data-path="data.character_book.recursive_scanning" data-label="Рекурсивное сканирование">
    </div>
    <div data-repeat="data.character_book.entries" data-item-title="name" data-label="Записи">
      <input data-path="name" data-label="Название">
      <nr-widget data-path="keys" data-widget="ccv3.lorebook-keys" data-label="Ключи"></nr-widget>
      <textarea data-path="content" data-label="Содержимое" data-props='{"rows":5}'></textarea>
      <div data-row class="row">
        <input type="checkbox" data-path="enabled" data-label="Включена">
        <input type="checkbox" data-path="case_sensitive" data-label="Учитывать регистр">
        <input type="number" data-path="insertion_order" data-label="Порядок вставки">
        <input type="number" data-path="priority" data-label="Приоритет">
      </div>
      <input data-path="comment" data-label="Комментарий">
    </div>
  </section>
  <section data-section="assets" data-title="Ассеты" class="panel">
    <h2>Ассеты</h2>
    <div data-repeat="data.assets" data-item-title="name">
      <div data-row class="row">
        <input data-path="type" data-label="Тип">
        <input data-path="name" data-label="Название">
        <input data-path="ext" data-label="Расширение">
      </div>
      <nr-widget data-path="uri" data-widget="image" data-label="Изображение" data-props='{"aspect":"1:1"}'></nr-widget>
    </div>
  </section>
  <section data-section="extensions" data-title="Расширения" data-collapsed class="panel">
    <h2>Расширения</h2>
    <nr-widget data-path="data.extensions" data-widget="json" data-label="extensions"></nr-widget>
  </section>
</nr-editor>
