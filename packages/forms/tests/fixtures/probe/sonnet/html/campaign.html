<nr-editor id="campaign" title="Журнал кампании">
  <script type="application/schema+json">
{
  "type": "object",
  "required": ["title"],
  "properties": {
    "title": {"type":"string","title":"Название"},
    "system": {"type":"string","enum":["fate","dnd5e","other"],"title":"Система"},
    "started": {"type":"string","title":"Начало"},
    "sessions": {"type":"array","title":"Сессии","items":{"type":"object","properties":{
      "title": {"type":"string","title":"Название"},
      "date": {"type":"string","title":"Дата"},
      "summary": {"type":"string","title":"Итоги"},
      "scenes": {"type":"array","title":"Сцены","items":{"type":"object","properties":{
        "title": {"type":"string","title":"Название"},
        "kind": {"type":"string","enum":["combat","social","explore"],"title":"Тип"},
        "notes": {"type":"string","title":"Заметки"},
        "npcs": {"type":"array","title":"НПС","items":{"type":"string"}},
        "initiative": {"type":"array","title":"Инициатива","items":{"type":"object","properties":{
          "name": {"type":"string","title":"Имя"},
          "roll": {"type":"integer","title":"Бросок"}}}},
        "clues": {"type":"array","title":"Улики","items":{"type":"object","properties":{
          "text": {"type":"string","title":"Улика"},
          "found": {"type":"boolean","title":"Найдена","default":false}}}}}}}}}}
  }
}
  </script>
  <style>
    .panel { border: 1px solid var(--nr-line); border-radius: var(--nr-radius); padding: var(--nr-space-4); }
    .row { display: flex; gap: var(--nr-space-4); }
    h2 { font-family: var(--nr-font-ui); color: var(--nr-accent); }
  </style>
  <section data-section="campaign" data-title="Кампания" class="panel">
    <h2>Кампания</h2>
    <div data-row class="row">
      <input data-path="title" data-label="Название">
      <select data-path="system" data-label="Система" data-props='{"labels":{"fate":"Fate","dnd5e":"D&D 5e","other":"Другая"}}'></select>
      <nr-widget data-path="started" data-widget="date" data-label="Начало"></nr-widget>
    </div>
  </section>
  <section data-section="sessions" data-title="Сессии" class="panel">
    <h2>Сессии</h2>
    <div data-repeat="sessions" data-item-title="title" data-label="Сессии">
      <div data-row class="row">
        <input data-path="title" data-label="Название">
        <nr-widget data-path="date" data-widget="date" data-label="Дата"></nr-widget>
      </div>
      <nr-widget data-path="summary" data-widget="markdown" data-label="Итоги"></nr-widget>
      <output data-computed="foundClues" data-type="number" data-label="Найдено улик"><{ set marks }><{ for s in item.scenes }><{ for c in s.clues }><{ if c.found }>x<{ endif }><{ endfor }><{ endfor }><{ endset }><< marks | length >></output>
      <div data-repeat="scenes" data-item-title="title" data-label="Сцены">
        <div data-row class="row">
          <input data-path="title" data-label="Название">
          <select data-path="kind" data-label="Тип" data-props='{"labels":{"combat":"Бой","social":"Общение","explore":"Исследование"}}'></select>
        </div>
        <textarea data-path="notes" data-label="Заметки" data-props='{"rows":4}'></textarea>
        <nr-widget data-path="npcs" data-widget="tags" data-label="НПС"></nr-widget>
        <div data-repeat="initiative" data-item-title="name" data-label="Инициатива" data-show-if='{"kind":["combat"]}'>
          <div data-row class="row">
            <input data-path="name" data-label="Имя">
            <input type="number" data-path="roll" data-label="Бросок">
          </div>
        </div>
        <div data-repeat="clues" data-item-title="text" data-label="Улики">
          <div data-row class="row">
            <input data-path="text" data-label="Улика">
            <input type="checkbox" data-path="found" data-label="Найдена">
          </div>
        </div>
      </div>
    </div>
  </section>
</nr-editor>
